<!-- ============================================================================
  FILE: task-filter.component.html
  PURPOSE: Multi-criteria filter toolbar: Status, Priority, Category, Sorting, and Reset
============================================================================ -->

<div class="rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 shadow-xs">
  <div class="flex flex-wrap items-center justify-between gap-3">
    
    <!-- Left Filters Area: Status, Priority, Category -->
    <div class="flex flex-wrap items-center gap-2.5">
      
      <!-- Filter Label / Icon -->
      <div class="hidden sm:flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mr-1">
        <app-icon name="filter" [size]="14" />
        <span>Filters</span>
      </div>

      <!-- Status Filter Dropdown / Pills -->
      <div class="relative">
        <select
          [value]="selectedFilter().status"
          (change)="onStatusFilter($any($event.target).value)"
          class="appearance-none rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-2 pl-3 pr-8 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition cursor-pointer"
          [class.border-indigo-500]="selectedFilter().status !== 'ALL'"
          [class.text-indigo-600]="selectedFilter().status !== 'ALL'"
        >
          <option value="ALL">Status: All</option>
          <option value="PENDING">Status: Pending</option>
          <option value="IN_PROGRESS">Status: In Progress</option>
          <option value="COMPLETED">Status: Completed</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
          <app-icon name="chevron-down" [size]="14" />
        </div>
      </div>

      <!-- Priority Filter Dropdown -->
      <div class="relative">
        <select
          [value]="selectedFilter().priority"
          (change)="onPriorityFilter($any($event.target).value)"
          class="appearance-none rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-2 pl-3 pr-8 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition cursor-pointer"
          [class.border-indigo-500]="selectedFilter().priority !== 'ALL'"
          [class.text-indigo-600]="selectedFilter().priority !== 'ALL'"
        >
          <option value="ALL">Priority: All</option>
          <option value="HIGH">Priority: High</option>
          <option value="MEDIUM">Priority: Medium</option>
          <option value="LOW">Priority: Low</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
          <app-icon name="chevron-down" [size]="14" />
        </div>
      </div>

      <!-- Category Filter Dropdown -->
      <div class="relative">
        <select
          [value]="selectedFilter().category || 'ALL'"
          (change)="onCategoryFilter($any($event.target).value)"
          class="appearance-none rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-2 pl-3 pr-8 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition cursor-pointer"
          [class.border-indigo-500]="selectedFilter().category && selectedFilter().category !== 'ALL'"
          [class.text-indigo-600]="selectedFilter().category && selectedFilter().category !== 'ALL'"
        >
          <option value="ALL">Category: All</option>
          @for (cat of categoryOptions; track cat) {
            @if (cat !== 'ALL') {
              <option [value]="cat">Category: {{ cat }}</option>
            }
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
          <app-icon name="chevron-down" [size]="14" />
        </div>
      </div>

      <!-- Sort Dropdown -->
      <div class="relative">
        <select
          (change)="onSortChange($event)"
          class="appearance-none rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 py-2 pl-3 pr-8 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition cursor-pointer"
        >
          @for (s of sortOptions; track s.label) {
            <option [value]="s.value + ':' + s.dir">{{ s.label }}</option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400">
          <app-icon name="arrow-up-down" [size]="14" />
        </div>
      </div>
    </div>

    <!-- Right Area: Reset Filters button if active -->
    @if (hasActiveFilters()) {
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-400">
          {{ activeFilterCount() }} active
        </span>
        <button
          (click)="onReset()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition active:scale-95"
        >
          <app-icon name="x" [size]="13" />
          <span>Clear Filters</span>
        </button>
      </div>
    }
  </div>
</div>
