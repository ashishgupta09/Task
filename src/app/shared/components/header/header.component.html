<!-- ============================================================================
  FILE: header.component.html
  PURPOSE: Top navigation bar displaying real-time global state from BehaviorSubject,
           dynamic breadcrumb navigation, theme toggle, and user profile
============================================================================ -->

<header class="h-16 bg-white dark:bg-[#0F172A] border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 transition-colors">
  <div class="h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
    
    <!-- Left Section: Mobile Menu + Breadcrumbs -->
    <div class="flex items-center gap-3 min-w-0">
      <!-- Mobile Sidebar Toggle -->
      <button
        (click)="sidebarService.toggleMobile()"
        class="lg:hidden p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
        aria-label="Toggle mobile navigation"
      >
        <app-icon name="menu" [size]="20" />
      </button>

      <!-- App Brand (Visible on mobile/tablet or when sidebar collapsed) -->
      <a routerLink="/dashboard" class="flex lg:hidden items-center gap-2 font-bold text-slate-900 dark:text-white">
        <span class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-xs">⚡</span>
        <span class="text-sm font-extrabold tracking-tight">TaskManager 22</span>
      </a>

      <!-- Desktop Breadcrumbs -->
      <nav class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400">
        <span class="hidden md:inline font-bold text-slate-800 dark:text-slate-200">TaskManager 22</span>
        <span class="hidden md:inline text-slate-300 dark:text-slate-600">/</span>
        <a routerLink="/dashboard" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition">Workspace</a>
        <span class="text-slate-300 dark:text-slate-600">/</span>
        <span class="text-indigo-600 dark:text-indigo-400 font-semibold truncate">{{ currentRouteLabel() }}</span>
      </nav>
    </div>

    <!-- Center/Search Section -->
    <div class="hidden md:flex flex-1 max-w-md mx-2">
      <div class="relative w-full">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
          <app-icon name="search" [size]="16" />
        </div>
        <input
          type="text"
          (input)="onGlobalSearch($event)"
          placeholder="Search all tasks, assignees, keywords..."
          class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 py-1.5 pl-9 pr-4 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
        />
      </div>
    </div>

    <!-- Right Controls Section -->
    <div class="flex items-center gap-2 sm:gap-3">
      
      <!-- Live Action Ticker (BehaviorSubject RxJS stream) -->
      <div class="hidden xl:flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700/60 text-[11px] text-slate-600 dark:text-slate-300">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-medium text-slate-400 dark:text-slate-500">Live Stream:</span>
        <span class="truncate max-w-[140px] font-medium text-indigo-600 dark:text-indigo-400">{{ lastAction() }}</span>
      </div>

      <!-- Real-time Synced Task Counter Badge -->
      <div class="hidden sm:flex items-center gap-1.5 bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800/60 px-2.5 py-1 rounded-lg text-xs font-semibold text-indigo-700 dark:text-indigo-300">
        <app-icon name="layers" [size]="14" />
        <span>Synced:</span>
        <span class="bg-indigo-600 text-white font-bold px-1.5 py-0.2 rounded-full text-[10px]">
          {{ taskCount() }}
        </span>
      </div>

      <!-- Theme Switcher (Light / Dark) -->
      <button
        (click)="toggleTheme()"
        type="button"
        class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
        [title]="themeService.currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle theme"
      >
        @if (themeService.currentTheme() === 'dark') {
          <app-icon name="sun" [size]="18" class="text-amber-400" />
        } @else {
          <app-icon name="moon" [size]="18" class="text-slate-600" />
        }
      </button>

      <!-- Notification Dropdown Component (RxJS BehaviorSubject + AsyncPipe) -->
      <app-notification />

      <!-- Vertical Divider -->
      <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>

      <!-- Primary Action: Create Task -->
      <button
        (click)="navigateToCreate()"
        class="hidden sm:inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-3.5 py-2 rounded-xl shadow-sm shadow-indigo-600/25 active:scale-95 transition"
      >
        <app-icon name="plus" [size]="15" strokeWidth="2.5" />
        <span>New Task</span>
      </button>

      <!-- User Profile Dropdown -->
      <div class="relative">
        <button
          (click)="toggleProfileMenu()"
          class="flex items-center gap-2 p-1 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
          aria-expanded="false"
        >
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold text-xs shadow-xs">
            AM
          </div>
          <div class="hidden md:flex flex-col text-left">
            <span class="text-xs font-bold text-slate-800 dark:text-white leading-tight">Alex Morgan</span>
            <span class="text-[10px] text-slate-400 leading-none">Architect</span>
          </div>
          <app-icon name="chevron-down" [size]="14" class="text-slate-400 hidden sm:inline" />
        </button>

        <!-- Dropdown Menu -->
        @if (isProfileMenuOpen()) {
          <!-- Backdrop -->
          <div (click)="closeProfileMenu()" class="fixed inset-0 z-40"></div>

          <div class="absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-slate-900 shadow-xl border border-slate-200 dark:border-slate-800 py-2 z-50 animate-in fade-in zoom-in-95 duration-150">
            <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800">
              <p class="text-xs font-bold text-slate-900 dark:text-white">Alex Morgan</p>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">alex.morgan&#64;saasflow.io</p>
            </div>
            
            <div class="py-1">
              <a
                routerLink="/dashboard"
                (click)="closeProfileMenu()"
                class="flex items-center gap-2.5 px-4 py-2 text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition"
              >
                <app-icon name="user" [size]="15" />
                <span>My Profile</span>
              </a>
              <button
                (click)="closeProfileMenu(); toggleTheme()"
                class="w-full flex items-center justify-between px-4 py-2 text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition text-left"
              >
                <div class="flex items-center gap-2.5">
                  <app-icon name="moon" [size]="15" />
                  <span>Theme: {{ themeService.currentTheme() | uppercase }}</span>
                </div>
              </button>
            </div>

            <div class="pt-1 border-t border-slate-100 dark:border-slate-800">
              <button
                (click)="closeProfileMenu()"
                class="w-full flex items-center gap-2.5 px-4 py-2 text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition text-left font-medium"
              >
                <app-icon name="log-out" [size]="15" />
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
