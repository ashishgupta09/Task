<!-- ============================================================================
  FILE: header.component.html
  PURPOSE: Top navigation bar displaying real-time global state from BehaviorSubject,
           dynamic breadcrumb navigation, theme toggle, and user profile
============================================================================ -->

<header class="topbar" role="banner">
  <div class="topbar__inner">
    <div class="topbar__left">
      <button
        type="button"
        (click)="sidebarService.toggleMobile()"
        class="topbar__menu-button lg:hidden"
        aria-label="Toggle mobile navigation"
      >
        <app-icon name="menu" [size]="20" />
      </button>

      <a routerLink="/dashboard" class="topbar__brand" aria-label="Open dashboard">
        <span class="topbar__brand-text">TaskManager</span>
        <span class="topbar__brand-badge">22</span>
      </a>
    </div>

    <nav class="topbar__crumbs" aria-label="Breadcrumb">
      <span class="topbar__crumb topbar__crumb--muted">Workspace</span>
      <span class="topbar__divider">/</span>
      <span class="topbar__crumb topbar__crumb--active">{{ currentRouteLabel() }}</span>
    </nav>

    <div class="topbar__actions">
      <div class="topbar__pill topbar__pill--ghost hidden xl:flex">
        <span class="topbar__live-dot"></span>
        <span>Live</span>
        <span class="topbar__pill-text">{{ lastAction() }}</span>
      </div>

      <div class="topbar__pill topbar__pill--ghost hidden lg:flex">
        <app-icon name="layers" [size]="15" />
        <span>Synced:</span>
        <span class="topbar__count">{{ taskCount() }}</span>
      </div>

      <app-theme-toggle />
      <app-notification />

      <button
        type="button"
        (click)="navigateToCreate()"
        class="topbar__new-task hidden sm:inline-flex"
      >
        <app-icon name="plus" [size]="15" strokeWidth="2.5" />
        <span>New Task</span>
      </button>

      <div class="topbar__profile-wrap">
        <button
          type="button"
          (click)="toggleProfileMenu()"
          class="topbar__profile"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="topbar__avatar">AM</span>
          <span class="topbar__profile-text">
            <span class="topbar__profile-name">Alex</span>
            <span class="topbar__profile-role">Architect</span>
          </span>
          <app-icon name="chevron-down" [size]="13" />
        </button>

        @if (isProfileMenuOpen()) {
          <div class="topbar__dropdown" role="menu" aria-label="Profile actions">
            <div class="topbar__dropdown-header">
              <p>Alex Morgan</p>
              <span>alex.morgan@saasflow.io</span>
            </div>

            <div class="topbar__dropdown-body">
              <a routerLink="/dashboard" (click)="closeProfileMenu()" class="topbar__dropdown-item">
                <app-icon name="user" [size]="15" />
                <span>My Profile</span>
              </a>
              <button type="button" (click)="closeProfileMenu(); toggleTheme()" class="topbar__dropdown-item text-left">
                <app-icon name="moon" [size]="15" />
                <span>Theme: {{ themeService.currentTheme() | uppercase }}</span>
              </button>
            </div>

            <div class="topbar__dropdown-footer">
              <button type="button" (click)="closeProfileMenu()" class="topbar__dropdown-item topbar__dropdown-item--danger">
                <app-icon name="log-out" [size]="15" />
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
